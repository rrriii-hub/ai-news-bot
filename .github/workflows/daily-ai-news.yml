name: Daily AI News

on:
  schedule:
    # 14:45 JST に起動 → スクリプトが 15:00 JST まで待ってから投稿
    # GitHubの定時実行は混雑すると遅れたり、実行されなかったりすることがあるため、
    # 16:17 と 18:47 にも予備で起動します（その日の分が投稿済みなら何もしません）
    # 時間どおりに届けるには、README の⑥の「目覚まし」（ai-news-timer.yml）も使ってください
    - cron: "45 5 * * *"
    - cron: "17 7 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch: # 「Run workflow」ボタンで手動実行できる
    inputs:
      mode:
        description: "post = 今すぐ投稿 / check = 投稿せずに投稿先と中身を確認 / daily = 今日の分がまだなら投稿（15時の65分前より早いと何もしない）"
        type: choice
        options:
          - post
          - check
          - daily
        default: post

permissions:
  contents: write # 投稿済み履歴(posted.json)を保存するため

concurrency:
  group: daily-ai-news # 同時に起動しても1つずつ順番に動かす（二重投稿防止）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # 投稿時刻の最大65分前に起動して待つことがあるため
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # 起動した時点ではなく、最新の投稿履歴を読む（二重投稿防止）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post AI news to Discord
        run: python ai_news.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 「今日のまとめ」用（未登録ならニュースだけ投稿）
          RUN_MODE: ${{ inputs.mode }}

      - name: Save posted history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posted history"
            git pull --rebase
            git push
          fi
